name: Release

# A version tag (v0.1.0, ...) builds the .deb and publishes it as a GitHub
# pre-release. workflow_dispatch only builds it, as a workflow artifact, so
# the build can be tried without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; only the publish job may write (to Releases).
permissions:
  contents: read

jobs:
  deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The package takes its version from package.json, so a tag that says
      # something else would publish a mislabelled .deb.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($want)"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build the package
        run: packaging/deb/build.sh

      # Every module extension.js imports must be in the package, or the
      # GNOME extension fails to load and nothing is tracked.
      - name: Check the packaged GNOME extension is complete
        run: |
          dir=$(mktemp -d)
          dpkg-deb -x dist/*.deb "$dir"
          ext="$dir/usr/share/gnome-shell/extensions/screentime-focus@akkki007.github.io"
          missing=0
          for f in "$ext"/*.js; do
            for m in $(grep -oE "from '\./[A-Za-z]+\.js'" "$f" | sed -E "s/from '\.\/(.*)'/\1/"); do
              [ -f "$ext/$m" ] || { echo "::error::$(basename "$f") imports $m, which is not packaged"; missing=1; }
            done
          done
          exit $missing

      - name: Upload the .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screentime-deb
          path: dist/*.deb

  publish:
    name: Publish the GitHub release
    needs: deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: screentime-deb
          path: dist

      - name: Create the pre-release with the .deb attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "Screentime $GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes
