name: Release build

# Builds the .deb when a version tag is pushed. Not yet exercised on GitHub:
# test it with a throwaway tag before relying on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Build the package
        run: packaging/deb/build.sh

      - name: Upload the .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screentime-deb
          path: dist/*.deb
