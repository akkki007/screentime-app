name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The desktop app's typecheck and build download the Hutch/Electrobun
      # toolchain on first use (`electrobun prepare`).
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # A full Electrobun package is too heavy for every PR; the release
      # workflow builds it. Here we check that every part still compiles.
      - name: Build
        run: |
          bun run --cwd extensions/browser build
          bun run --cwd apps/desktop build:view

  go:
    name: Go vet, test, vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The version comes from go.mod (its toolchain line), not this file.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # The focus providers' integration tests need a private session bus
      # and a private X server (no window manager).
      - name: Install test servers
        run: sudo apt-get update && sudo apt-get install -y dbus xvfb

      - name: Test
        run: |
          Xvfb :99 -screen 0 640x480x24 &
          SCREENTIME_TEST_X_DISPLAY=:99 go test -race ./...

      - name: Vulnerability check
        # Pinned as a module tool (go.mod), so go.sum locks its version.
        run: go tool govulncheck ./...

  contract-go:
    name: Contract fixtures against screentimed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build screentimed
        run: go build -o bin/screentimed ./cmd/screentimed

      # The daemon's frozen IPC contract (contract/README.md).
      - name: Replay
        run: CONTRACT_DAEMON_CMD="$PWD/bin/screentimed" bun test contract
