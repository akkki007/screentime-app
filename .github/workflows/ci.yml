name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The desktop app's typecheck and build download the Hutch/Electrobun
      # toolchain on first use (`electrobun prepare`).
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # A full Electrobun package is too heavy for every PR; the release
      # workflow builds it. Here we check that every part still compiles.
      - name: Build
        run: |
          bun run --cwd apps/daemon build
          bun run --cwd extensions/browser build
          bun run --cwd apps/desktop build:view
